spring:
  application:
    name: resolve-support-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resolve_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.resolve.support: INFO
    org.springframework.orm.jpa: WARN
