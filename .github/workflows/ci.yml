name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verification
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder-only
          JWT_SECRET_BASE64: Y2ktcGxhY2Vob2xkZXItc2VjcmV0LW9ubHktZm9yLWNvbmZpZw==
        run: docker compose config --quiet

      - name: Validate Docker image build
        run: docker build --tag resolve-support-api:ci .

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: warn
          retention-days: 14
